<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 背景グラデーション（和歌山サンライズオレンジ） -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <!-- 葉っぱグラデーション -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <!-- 微細なドロップシャドウ -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" flood-color="#7c2d12" />
    </filter>
  </defs>

  <!-- アイコンベース（角丸スクワークル） -->
  <rect x="4" y="6" width="56" height="54" rx="16" ry="16" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- 微細なインナーハイライト -->
  <rect x="5" y="7" width="54" height="26" rx="15" ry="15" fill="#ffffff" opacity="0.15" />

  <!-- みかんの若葉アクセント（右上） -->
  <path d="M 40 4 C 47 3 53 7 54 13 C 48 15 42 12 40 4 Z" fill="url(#leafGrad)" />
  <path d="M 40 4 Q 45 9 51 11" stroke="#a7f3d0" stroke-width="0.8" fill="none" opacity="0.7" />

  <!-- 中央のモダンな「和」の文字 -->
  <g fill="#ffffff" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.2))">
    <text x="32" y="42" font-family="'Shippori Mincho', 'Noto Serif JP', serif" font-weight="800" font-size="30" text-anchor="middle" letter-spacing="-1">和</text>
  </g>
</svg>
